<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página Não Encontrada | Macaúba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050d0a;
      --amber: #e6b43c;
      --ink: #e6f0ea;
      --ink-dim: #9ab4a3;
      --line: rgba(230,240,234,0.12);
    }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Archivo', sans-serif;
    }
    .font-display { font-family: 'Cinzel', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[#050d0a] selection:bg-[#e6b43c]/20 selection:text-[#e6b43c]">
  <div class="max-w-md w-full border border-[var(--line)] rounded-3xl bg-[#0c1d16]/80 backdrop-blur-xl p-8 md:p-10 text-center shadow-2xl relative overflow-hidden">
    <!-- Glow decorativo -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#e6b43c]/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-[#1a4a35]/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl border border-[var(--line)] bg-[#050d0a] text-[var(--amber)] mb-6 shadow-inner">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
        <path d="M20 4 C 28 8, 32 14, 32 22 C 32 30, 26 36, 20 36 C 14 36, 8 30, 8 22 C 8 14, 12 8, 20 4 Z" stroke="#e6b43c" stroke-width="1.5" fill="none"/>
        <circle cx="20" cy="22" r="4" fill="#e6b43c"/>
        <path d="M20 36 L 20 39" stroke="#e6b43c" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="font-mono text-[11px] uppercase tracking-[.3em] text-[var(--amber)] mb-2">Erro 404</div>
    <h1 class="font-display text-3xl md:text-4xl text-[var(--ink)] mb-3">Página Não Encontrada</h1>
    <p class="text-[14px] text-[var(--ink-dim)] leading-relaxed mb-8">
      A rota ou documento que você tentou acessar não existe ou foi realocado na plataforma.
    </p>

    <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-full font-mono text-[12px] uppercase tracking-[.2em] font-semibold bg-[var(--amber)] text-[#050d0a] hover:bg-[#f3c65c] transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-[#e6b43c]/10">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Retornar ao Início</span>
    </a>

    <div class="mt-8 pt-6 border-t border-[var(--line)] text-[11px] font-mono uppercase tracking-[.25em] text-[var(--ink-dim)]/60">
      Macaúba · Soberania & Bioenergia
    </div>
  </div>
</body>
</html>
